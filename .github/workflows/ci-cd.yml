name: CI/CD Angular

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: CI (instalar, probar y compilar)
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test -- --no-watch

      - name: Generar build de producción
        run: npm run build -- --configuration production

      - name: Guardar build como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: build-angular
          path: dist/registro-clientes/browser
          include-hidden-files: true

  deploy:
    name: CD (desplegar por FTP)
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar build validado
        uses: actions/download-artifact@v5
        with:
          name: build-angular
          path: deploy

      - name: Subir aplicación al hosting por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./deploy/
          server-dir: htdocs/