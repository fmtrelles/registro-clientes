<section class="tarjeta">
  <header class="tarjeta__cabecera">
    <h1>Registro de cliente</h1>
    <p>Complete los datos para registrar un nuevo cliente.</p>
  </header>

  <form [formGroup]="form" (ngSubmit)="enviar()" class="formulario">
    <div class="campo">
      <label for="nombres">Nombres y apellidos</label>
      <input id="nombres" type="text" formControlName="nombres" autocomplete="name" />
    </div>

    <div class="campo">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" formControlName="email" autocomplete="email" />
    </div>

    <div class="fila">
      <div class="campo">
        <label for="dni">DNI</label>
        <input id="dni" type="text" inputmode="numeric" formControlName="dni" />
      </div>

      <div class="campo">
        <label for="telefono">Celular</label>
        <input id="telefono" type="tel" inputmode="numeric" formControlName="telefono" autocomplete="tel" />
      </div>
    </div>

    <div class="campo">
      <label for="fechaNacimiento">Fecha de nacimiento</label>
      <input id="fechaNacimiento" type="date" formControlName="fechaNacimiento" />
    </div>

    <div class="campo campo--check">
      <input id="aceptaTerminos" type="checkbox" formControlName="aceptaTerminos" />
      <label for="aceptaTerminos">Acepto los términos y condiciones</label>
    </div>

    <button type="submit" class="boton">Registrar cliente</button>
  </form>

  @if (clienteRegistrado(); as cliente) {
    <div class="exito" role="status">
      Cliente <strong>{{ cliente.nombres }}</strong> registrado correctamente.
    </div>
  }
</section>
